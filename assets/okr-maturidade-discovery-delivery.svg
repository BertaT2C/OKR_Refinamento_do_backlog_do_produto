<text x="1200" y="577" fill="#40526b" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="500" >mostrarem resultados</text>
<text x="1200" y="605" fill="#40526b" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="500" >e acompanhar evolução.</text><rect x="1200" y="599" width="310" height="26" rx="12" fill="#eff5fa" stroke="none" stroke-width="1"/><text x="1210" y="618" fill="#087c80" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="800" letter-spacing="1">EVOLUÇÃO CONTÍNUA</text><text x="71" y="683" fill="#2d2d54" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" font-weight="800" letter-spacing=".5">KEY RESULTS  |  RESULTADOS-CHAVE A MENSURAR</text><rect x="70" y="704" width="710" height="132" rx="18" fill="#fff" stroke="#dce3eb" stroke-width="1.5"/><rect x="70" y="704" width="10" height="132" rx="5" fill="#6652ac" stroke="none" stroke-width="1"/><text x="98" y="735" fill="#6652ac" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="850" letter-spacing="1">KR 1</text><text x="98" y="770" fill="#202f46" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="26" font-weight="800" >Maturidade dos times</text><text x="98" y="796" fill="#42536c" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="500" >% de times que atingem o nível</text>
