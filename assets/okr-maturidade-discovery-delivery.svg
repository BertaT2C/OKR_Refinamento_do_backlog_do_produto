<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960" role="img" aria-labelledby="svg-title svg-desc">
<title id="svg-title">Modelo de OKR estratégico: maturidade em Discovery e Delivery</title>
<desc id="svg-desc">Infográfico de estudo de caso com objetivo estratégico, roadmap por trimestre, dois resultados-chave mensuráveis com metas ainda a definir, iniciativas e outcomes. Não representa implantação ou metas atingidas.</desc>
<defs>
 <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#23124d"/><stop offset="1" stop-color="#4d388f"/></linearGradient>
 <linearGradient id="footer" x1="0" y1="0" x2="1"><stop stop-color="#e7faf4"/><stop offset="1" stop-color="#f2edfc"/></linearGradient>
</defs>
<rect x="0" y="0" width="1600" height="960" rx="0" fill="#f7f9fc" stroke="none" stroke-width="1"/>
<rect x="24" y="24" width="1552" height="189" rx="28" fill="url(#hero)" stroke="none" stroke-width="1"/>
<text x="72" y="71" fill="#d9cef9" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" letter-spacing="2">FRAMEWORK DE PRODUTO  /  ESTUDO DE CASO</text>
<text x="70" y="136" fill="#ffffff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="49" font-weight="800" >OKR  |  Maturidade em Discovery &amp; Delivery</text>
<text x="72" y="182" fill="#ede8ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" font-weight="450" >Objetivos claros, resultados mensuráveis e iniciativas conectadas ao valor</text>
<rect x="71" y="238" width="1458" height="118" rx="18" fill="#ffffff" stroke="#d8dde9" stroke-width="1.5"/>
