<text x="90" y="577" fill="#40526b" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="500" >de Discovery e Delivery</text>
<text x="90" y="605" fill="#40526b" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="500" >e identificar oportunidades.</text><rect x="90" y="599" width="310" height="26" rx="12" fill="#eff5fa" stroke="none" stroke-width="1"/><text x="100" y="618" fill="#5f3daa" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="800" letter-spacing="1">LINHA DE BASE</text><rect x="440" y="418" width="350" height="218" rx="19" fill="#fff" stroke="#dbe3ec" stroke-width="1.4"/><rect x="440" y="418" width="350" height="57" rx="19" fill="#2f6db2" stroke="none" stroke-width="1"/><rect x="440" y="458" width="350" height="17" rx="0" fill="#2f6db2" stroke="none" stroke-width="1"/><text x="460" y="455" fill="white" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" font-weight="800" >Q2 · Abr–Jun</text><text x="460" y="512" fill="#22294a" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="26" font-weight="780" >Estruturar</text><text x="460" y="549" fill="#40526b" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="500" >Definir instrumentos de</text>
<text x="460" y="577" fill="#40526b" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="500" >avaliação, trilhas e</text>
<text x="460" y="605" fill="#40526b" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="500" >base de conhecimento.</text><rect x="460" y="599" width="310" height="26" rx="12" fill="#eff5fa" stroke="none" stroke-width="1"/><text x="470" y="618" fill="#2f6db2" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="800" letter-spacing="1">CAPACITAÇÃO</text><rect x="810" y="418" width="350" height="218" rx="19" fill="#fff" stroke="#dbe3ec" stroke-width="1.4"/><rect x="810" y="418" width="350" height="57" rx="19" fill="#684ba3" stroke="none" stroke-width="1"/><rect x="810" y="458" width="350" height="17" rx="0" fill="#684ba3" stroke="none" stroke-width="1"/><text x="830" y="455" fill="white" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" font-weight="800" >Q3 · Jul–Set</text><text x="830" y="512" fill="#22294a" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="26" font-weight="780" >Experimentar</text><text x="830" y="549" fill="#40526b" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="500" >Aplicar melhorias,</text>
<text x="830" y="577" fill="#40526b" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="500" >medir engajamento e</text>
