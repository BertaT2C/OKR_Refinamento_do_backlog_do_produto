<text x="848" y="820" fill="#42536c" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="500" >validadas e participam das revisões.</text><text x="1268" y="736" fill="#178c8b" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="750" >Linha de base e meta: a definir</text><rect x="70" y="853" width="1460" height="82" rx="18" fill="url(#footer)" stroke="#cde9e2" stroke-width="1.2"/><text x="94" y="883" fill="#23564e" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="800" >INICIATIVAS (não são KRs)</text><text x="94" y="911" fill="#334f58" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="550" >Trilhas de aprendizagem  •  Base de conhecimento  •  Bootcamp  •  Revisões de OKR  •  Experimentos</text><text x="71" y="954" fill="#637387" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="500" >Nota: exemplo de estruturação para portfólio. Não representa metas aprovadas nem resultados medidos.</text></svg>