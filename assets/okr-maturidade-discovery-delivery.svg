<text x="105" y="273" fill="#5b408e" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="800" letter-spacing="1">OBJETIVO ESTRATÉGICO (O)</text>
<text x="105" y="310" fill="#233547" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="28" font-weight="750" >Elevar a maturidade das práticas de Discovery e Delivery,</text>
<text x="105" y="341" fill="#233547" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="520" >fortalecendo autonomia, engajamento e eficiência dos times.</text>
<text x="72" y="396" fill="#2f2f57" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="800" letter-spacing=".5">ROADMAP  |  QUANDO E COMO EVOLUIR</text>
